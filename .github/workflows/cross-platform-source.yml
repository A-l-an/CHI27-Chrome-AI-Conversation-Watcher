name: Cross-platform source validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    name: Validate and package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      CHI27_ARTIFACT_REPOSITORY: ${{ github.repository }}
      CHI27_ARTIFACT_SOURCE_COMMIT: ${{ github.sha }}
      CHI27_ARTIFACT_RELEASE_STAGE: source_validation
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2025
          - macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Run source and package tests
        run: npm test
      - name: Build deterministic unpacked-extension artifact
        run: npm run package
      - name: Verify unpacked-extension artifact contract
        run: npm run verify:package
      - name: Upload unpacked-extension source artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: chi27-chrome-unpacked-extension-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.sha256
            dist/*.manifest.json
          if-no-files-found: error
          retention-days: 14
